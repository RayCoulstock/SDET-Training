services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neuropulse
      POSTGRES_USER: neuropulse
      POSTGRES_PASSWORD: neuropulse
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuropulse"]
      interval: 3s
      timeout: 3s
      retries: 15
  device-simulator:
    build: ./src/NeuroPulse.DeviceSimulator
    ports: ["5100:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./src/NeuroPulse.Api
    environment:
      ConnectionStrings__NeuroPulse: Host=postgres;Database=neuropulse;Username=neuropulse;Password=neuropulse
      DeviceSimulatorUrl: http://device-simulator:8080
    ports: ["5000:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      device-simulator: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build: ./src/neuropulse-web
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres-data:
